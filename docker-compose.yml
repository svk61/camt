version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: support-platform-db
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: support-platform
    volumes:
      - mongodb_data:/data/db
    networks:
      - support-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: support-platform-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/support-platform?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - AGORA_APP_ID=${AGORA_APP_ID}
      - AGORA_APP_CERTIFICATE=${AGORA_APP_CERTIFICATE}
      - PORT=5000
    depends_on:
      - mongodb
    networks:
      - support-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:5000/api
        - REACT_APP_AGORA_APP_ID=${AGORA_APP_ID}
    container_name: support-platform-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - support-network

volumes:
  mongodb_data:

networks:
  support-network:
    driver: bridge